services:
  tfex:
    build: .
    container_name: quant-tfex-s50-multi-tf-swing
    # PID-1 reaper (tini): uvicorn runs as PID 1 and does not wait() on
    # children, so SIGKILLed healthcheck `curl` processes pile up as <defunct>
    # zombies. `init: true` makes Docker inject tini as PID 1 to reap them.
    init: true
    ports:
      - "8200:8000"
    environment:
      TFEX_S50_MULTI_TF_SWING_PUBLIC_MODE: "true"
      TFEX_S50_MULTI_TF_SWING_DB_WRITE_ENABLED: "false"
      TFEX_S50_MULTI_TF_SWING_DATA_DIR: /app/data
    volumes:
      # Phase 1: persist OHLCV Parquet across container restarts. Named volume,
      # so it survives `docker compose down` (but is reset by `down -v`).
      - tfex-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped

volumes:
  tfex-data:

networks:
  default:
    name: quant-network
    external: true
