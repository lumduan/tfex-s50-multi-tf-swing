[project]
name = "tfex-s50-multi-tf-swing"
version = "0.1.0"
description = "Multi-timeframe swing-intraday quant trading system for SET50 Index Futures (S50) on TFEX."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "lumduan", email = "bad.sonsuk@gmail.com" }]
keywords = ["quantitative-finance", "tfex", "s50", "futures", "swing-trading", "thailand"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "polars>=1.4",
    "pyarrow>=16",
    "tvkit>=0.11",
    "asyncpg>=0.29",
    "lightgbm>=4.6.0,<5.0.0",
    "numpy>=2.4.6,<3.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pre-commit>=3.7",
    "respx>=0.21",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "ipykernel>=7.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfex_s50_multi_tf_swing"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# ``importlib`` mode lets test modules with identical basenames coexist across
# packages (e.g. ``tests/unit/adapters/test_payload.py`` vs
# ``tests/integration/adapters/test_payload.py``).
addopts = [
    "--cov=src/tfex_s50_multi_tf_swing/adapters",
    "--cov=src/tfex_s50_multi_tf_swing/data",
    "--cov=src/tfex_s50_multi_tf_swing/features",
    "--cov=src/tfex_s50_multi_tf_swing/regime",
    "--cov=src/tfex_s50_multi_tf_swing/bias",
    "--cov=src/tfex_s50_multi_tf_swing/signals",
    "--cov=src/tfex_s50_multi_tf_swing/execution",
    "--cov=src/tfex_s50_multi_tf_swing/backtest",
    "--cov=src/tfex_s50_multi_tf_swing/ml",
    "--cov=src/tfex_s50_multi_tf_swing/risk",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    "--import-mode=importlib",
]
markers = [
    "infra_db: integration tests requiring quant-infra-db stack on quant-network",
    "gateway: integration tests requiring the live quant-api-gateway",
]

[tool.coverage.run]
source = [
    "src/tfex_s50_multi_tf_swing/adapters",
    "src/tfex_s50_multi_tf_swing/data",
    "src/tfex_s50_multi_tf_swing/features",
    "src/tfex_s50_multi_tf_swing/regime",
    "src/tfex_s50_multi_tf_swing/bias",
    "src/tfex_s50_multi_tf_swing/signals",
    "src/tfex_s50_multi_tf_swing/execution",
    "src/tfex_s50_multi_tf_swing/backtest",
    "src/tfex_s50_multi_tf_swing/ml",
    "src/tfex_s50_multi_tf_swing/risk",
]
branch = false

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.uv]
default-groups = ["dev"]
